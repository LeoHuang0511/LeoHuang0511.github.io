name: Get Citation Data

on: 
  # 移除 page_build，避免無限循環
  schedule:
    - cron: '0 8 * * *' # 每天早上 8 點執行一次
  workflow_dispatch:      # 允許您手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    # 加入超時限制，防止腳本卡死（保險機制）
    timeout-minutes: 15 
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Run Crawler
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        
    - name: Commit and Push
      run: |
        cd ./results
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git add *.json
        # 加上 [skip ci] 可以進一步確保不會觸發其他 Action
        git commit -m "Updated Citation Data [skip ci]"
        git push "${remote_repo}" HEAD:google-scholar-stats --force